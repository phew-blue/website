<!doctype html>
<html><head><meta charset="utf-8"><style>
  /* {{FONT_FACES}} — injected by scripts/generate-og.mjs from the build output */
  {{FONT_FACES}}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#000103;font-family:Poppins,sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
  /* Brand-blue bloom, echoing the site's near-black-soaked-in-blue ground */
  .glow{position:absolute;width:1100px;height:1100px;left:-260px;top:-520px;border-radius:50%;
        background:radial-gradient(circle,rgba(46,163,201,.20) 0%,rgba(46,163,201,.06) 42%,transparent 68%)}
  .glow2{position:absolute;width:820px;height:820px;right:-300px;bottom:-460px;border-radius:50%;
         background:radial-gradient(circle,rgba(29,233,182,.10) 0%,transparent 66%)}
  .inner{position:relative;display:flex;flex-direction:column;align-items:center}
  img{width:620px;height:auto;display:block}
  .rule{width:260px;height:3px;border-radius:2px;margin:40px 0 40px;
        background:linear-gradient(90deg,transparent,#2ea3c9 30%,#1de9b6 70%,transparent)}
  .name{font-weight:600;font-size:46px;color:#e2e9eb;letter-spacing:-.01em}
  .role{margin-top:16px;font-weight:400;font-size:23px;color:#819399;letter-spacing:.055em;text-transform:uppercase}
</style></head>
<body>
  <div class="glow"></div><div class="glow2"></div>
  <div class="inner">
    <img src="/phew-blue-logo-website.svg" alt="">
    <div class="rule"></div>
    <div class="name">Robert Sumner</div>
    <div class="role">Broadcast Technology &amp; Software</div>
  </div>
</body></html>
