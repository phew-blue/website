# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    tags: ["v*"]
  # Both integration branches. A PR into dev previously ran nothing at all —
  # ci.yml only watched main and dev.yml only fires on push — so the first time
  # a change was type-checked or built into an image was after it merged, when
  # dev.yml had already pushed :dev and deployed it. A broken build surfaced as
  # a broken dev site rather than a red PR.
  #
  # The build job needs no change to be safe here: it only logs in and pushes
  # when the event isn't a pull_request, so this gates PRs on a real Docker
  # build without publishing anything.
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  check:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run astro check

  build:
    name: Build & push
    needs: [check]
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/phew-blue/website
          tags: |
            type=raw,value={{tag}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc') }}
      - uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
      - name: Create summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "## ✅ ghcr.io/phew-blue/website:${{ steps.meta.outputs.version }}@${{ steps.build.outputs.digest }}"
            echo ""
            echo "**Tags pushed:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────────
  # Repoint production at the image just built.
  #
  # Mirrors what dev.yml does for the dev namespace: dispatch to home-ops
  # rather than committing from here, so the deploy credentials stay in one
  # repo. Tag-only — a pull_request build pushes no image, so there is nothing
  # to pin.
  #
  # Without this, cutting a release published an image and stopped: production
  # stayed pinned to whatever it was on. It had drifted three versions behind
  # before this was added.
  # ──────────────────────────────────────────────────────────────────
  reconcile:
    name: Reconcile production deployment
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Trigger deployment
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.build.outputs.digest }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DISPATCH_URL: ${{ secrets.HOME_OPS_DISPATCH_URL }}
        run: |
          if [[ -z "$DIGEST" ]]; then
            echo "::error::No digest from the build job — refusing to pin production to an empty value"
            exit 1
          fi
          printf '{"event_type":"website-deployed","client_payload":{"tag":"%s","digest":"%s"}}' \
            "${TAG}" "${DIGEST}" | gh api "$DISPATCH_URL" --method POST --input -
