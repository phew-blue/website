server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    port_in_redirect off;
    absolute_redirect off;

    # Serve Astro's built 404 page instead of soft-200ing the homepage
    error_page 404 /404.html;

    # Security headers. NB: nginx add_header inheritance — any location block
    # that declares its own add_header drops server-level ones, so these are
    # repeated in every location below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HTML and everything else unmatched below (incl. robots.txt, sitemaps):
    # revalidate on every request so deploys show up immediately.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Content-hashed build assets: safe to cache forever. ^~ so the extension
    # regex below cannot steal these and downgrade the cache lifetime.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Unhashed static files (favicon, root logos/images): short cache only,
    # since their URLs don't change when their contents do.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/xml text/xml application/json image/svg+xml;
}
