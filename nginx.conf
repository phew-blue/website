# Backing store for the GitHub mirror below. /var/cache/nginx is an emptyDir in
# the HelmRelease, which is what makes this possible at all — the container runs
# with readOnlyRootFilesystem, so it is one of the few writable paths.
proxy_cache_path /var/cache/nginx/github levels=1:2 keys_zone=github:1m
                 max_size=16m inactive=1h use_temp_path=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    port_in_redirect off;
    absolute_redirect off;

    # Serve Astro's built 404 page instead of soft-200ing the homepage
    error_page 404 /404.html;

    # Security headers. NB: nginx add_header inheritance — any location block
    # that declares its own add_header drops server-level ones, so these are
    # repeated in every location below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Same-origin mirror of the two GitHub API endpoints the software pages
    # read. Those pages are statically rendered, so their versions, dates and
    # changelogs are frozen at build time; the client re-reads them through
    # here on load and a release published since the last deploy shows up
    # without a rebuild.
    #
    # The cache is what makes that affordable. It is shared by every visitor,
    # so GitHub sees at most one request per repo per TTL no matter how much
    # traffic the site takes — instead of six per visitor against a 60/hour
    # unauthenticated limit. Visitors also never contact github.com themselves,
    # so their addresses are not handed over to read a version number.
    #
    # The TTL sets the whole site's cost: three repos, two endpoints each, so
    # 12 requests/hour at 30 minutes. Ten minutes would be 36 of the 60 this
    # address gets, leaving no room for anything else that egresses from the
    # cluster — including the CI builds that read the same API. Half an hour
    # of staleness on a version number is not worth that. A token here would
    # lift the limit to 5000/hour and make the TTL a free choice.
    #
    # The org is pinned in the regex. Without it this is an open proxy to any
    # repo on GitHub — and an open *authenticated* one the day a token is
    # added here.
    location ~ "^/api/gh/(?<gh_repo>phew-blue/[A-Za-z0-9._-]{1,64})(?<gh_path>/releases)?$" {
        limit_except GET HEAD { deny all; }

        # proxy_pass carries variables, so the name is resolved per request
        # rather than at startup and an explicit resolver is required. This is
        # kube-dns's ClusterIP, which is fixed for the cluster; outside it (a
        # bare docker run) the mirror fails and the pages fall back to their
        # build-time data, which is the pre-existing behaviour.
        resolver 10.43.0.10 valid=300s ipv6=off;
        resolver_timeout 5s;

        # The query string is fixed here rather than forwarded: a client-chosen
        # per_page would fragment the cache and let a visitor pull far more
        # than the page renders. Matches MAX_RELEASES in src/lib/github.ts.
        proxy_pass https://api.github.com/repos/$gh_repo$gh_path?per_page=5;

        proxy_ssl_server_name on;
        proxy_ssl_name api.github.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;

        proxy_set_header Host api.github.com;
        proxy_set_header Accept "application/vnd.github+json";
        proxy_set_header User-Agent "phew.blue-website";
        # Nothing from the client reaches GitHub: no cookies, no credentials,
        # and no conditional headers that would slip past the cache.
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";

        proxy_cache github;
        # Keyed on the repo alone — the upstream query string is fixed above,
        # and the default key includes the client's, which would let anyone
        # fill the cache with duplicates of the same response.
        proxy_cache_key "$gh_repo$gh_path";
        # GitHub answers with Cache-Control: private and a Vary that includes
        # Authorization and Cookie. Honoured, those disable caching outright.
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary X-Accel-Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Vary;
        proxy_cache_valid 200 30m;
        proxy_cache_valid 403 404 429 500 502 503 504 1m;
        # One request refreshes the entry for everyone else, who keep being
        # served the stale copy meanwhile — a slow or rate-limited GitHub
        # never becomes a slow page.
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;

        add_header Cache-Control "public, max-age=600";
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # HTML and everything else unmatched below (incl. robots.txt, sitemaps):
    # revalidate on every request so deploys show up immediately.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Content-hashed build assets: safe to cache forever. ^~ so the extension
    # regex below cannot steal these and downgrade the cache lifetime.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Unhashed static files (favicon, root logos/images): short cache only,
    # since their URLs don't change when their contents do.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/xml text/xml application/json image/svg+xml;
}
